<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>참가자 - 보드게임 사운드 퀴즈쇼</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div id="join-screen">
      <h1 class="center">🎲 참가자 입장</h1>
      <div class="panel">
        <label>닉네임</label>
        <input id="nickname-input" placeholder="닉네임을 입력하세요" maxlength="20" />
        <button id="join-btn" class="btn-primary" style="margin-top:16px; width:100%;">입장하기</button>
      </div>
    </div>

    <div id="game-screen" style="display:none;">
      <p class="center muted" id="my-name"></p>
      <div class="status-banner" id="status-banner">문제를 기다리는 중...</div>
      <button id="buzz-btn" class="buzz-btn" disabled>BUZZ!</button>
      <div class="panel">
        <h2>🏆 점수판</h2>
        <ul class="scoreboard" id="scoreboard"></ul>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="player.js"></script>
</body>
</html>
