<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>참가자 - 보드게임 사운드 퀴즈쇼</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <p><a href="/index.html">&larr; 홈으로</a></p>
    <div id="join-screen">
      <h1 class="center">🎲 참가자 입장</h1>
      <p class="center" id="kicked-message" style="display:none; color: var(--bad); font-weight:700;">🚫 진행자에 의해 게임에서 추방되었습니다. 다시 입장하려면 닉네임을 입력하세요.</p>
      <div class="panel">
        <label>닉네임</label>
        <input id="nickname-input" placeholder="닉네임을 입력하세요" maxlength="20" />
        <button id="join-btn" class="btn-primary" style="margin-top:16px; width:100%;">입장하기</button>
      </div>
    </div>

    <div id="game-screen" style="display:none;">
      <div style="display:flex; justify-content:center; align-items:center; gap:6px;">
        <p class="center muted" id="my-name" style="margin:0;"></p>
        <button id="my-name-edit-btn" type="button" title="내 닉네임 수정" style="padding:4px 8px; font-size:.85rem;">✏️</button>
      </div>
      <div class="status-banner" id="status-banner">문제를 기다리는 중...</div>

      <div class="panel center" id="host-judge-panel" style="display:none;">
        <button id="p-judge-correct-btn" class="btn-good" disabled>✅ 정답 처리</button>
        <button id="p-judge-wrong-btn" class="btn-bad" disabled>❌ 오답 처리</button>
        <button id="p-reveal-btn">🙈 정답 공개(패스)</button>
        <button id="p-reset-buzz-btn">🔄 부저 초기화</button>
      </div>

      <div class="buzz-wrap">
        <button id="buzz-btn" class="buzz-btn" disabled>BUZZ!</button>
        <button id="pass-btn" class="pass-btn" disabled>🙅 패스</button>
      </div>

      <div class="panel" id="vote-panel" style="display:none;">
        <h3 style="margin-bottom:8px;">🗳️ 정답 판정 투표 (진행자 없이 진행 중 — 과반수로 판정)</h3>
        <p class="muted" id="vote-status"></p>
        <div class="row">
          <button id="vote-correct-btn" class="btn-good">✅ 정답이에요</button>
          <button id="vote-wrong-btn" class="btn-bad">❌ 오답이에요</button>
        </div>
      </div>

      <div class="panel">
        <h2>🏆 점수판</h2>
        <ul class="scoreboard" id="scoreboard"></ul>
      </div>

      <div class="panel" id="settings-toggle-wrap" style="display:none;">
        <button id="settings-toggle-btn" style="width:100%;">⚙️ 진행 설정 (진행자 없이 직접 진행하기)</button>
        <p class="muted" id="host-presence-note" style="margin-top:8px;"></p>
        <div id="settings-panel" style="display:none; margin-top:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
            <button id="p-filter-toggle-btn" type="button">⚙️ 문제 설정</button>
            <button id="p-q-list-toggle-btn" type="button">📋 문제 목록</button>
          </div>

          <div id="p-filter-settings-panel" hidden style="margin-bottom:16px;">
            <h3 style="margin-bottom:8px;">🎚️ 재생 길이</h3>
            <div id="p-duration-picker" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;"></div>

            <h3 style="margin-bottom:8px;">🗂️ 연도 선택</h3>
            <div id="p-filter-year-buttons" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px;"></div>
            <h3 style="margin:16px 0 8px;">🏷️ 카테고리 선택</h3>
            <div id="p-filter-category-buttons" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;"></div>

            <h3 style="margin-bottom:8px;">🎮 자동 출제</h3>
            <div class="row" style="align-items:flex-end;">
              <div>
                <label style="margin-top:0;">문제 수</label>
                <input id="p-auto-count" type="number" min="1" value="10" />
                <div class="row" style="margin-top:6px;">
                  <button type="button" class="p-auto-count-preset" data-count="10">10문제</button>
                  <button type="button" class="p-auto-count-preset" data-count="20">20문제</button>
                  <button type="button" class="p-auto-count-preset" data-count="30">30문제</button>
                </div>
              </div>
              <div>
                <label style="margin-top:0;">문제 간 대기시간(초)</label>
                <input id="p-auto-gap" type="number" min="0" step="0.5" value="3" />
                <div class="row" style="margin-top:6px;">
                  <button type="button" class="p-auto-gap-preset" data-gap="1">1초</button>
                  <button type="button" class="p-auto-gap-preset" data-gap="3">3초</button>
                  <button type="button" class="p-auto-gap-preset" data-gap="5">5초</button>
                </div>
              </div>
            </div>
            <div class="row" style="margin-top:10px;">
              <button id="p-auto-start-btn" class="btn-good">▶ 자동 출제 시작</button>
              <button id="p-auto-stop-btn" class="btn-bad" style="display:none;">⏹ 자동 출제 중지</button>
            </div>
            <p class="muted" id="p-auto-status" style="margin-top:8px;"></p>
          </div>

          <div id="p-q-list-panel" hidden style="margin-bottom:16px;">
            <h3>문제 목록 (<span id="p-q-buttons-count">0</span>개)</h3>
            <div id="p-q-buttons" style="display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto;"></div>
          </div>

          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin:10px 0;">
            <input type="checkbox" id="p-hide-video-checkbox" style="width:auto;" />
            <span>🙈 화면 가리기 (영상은 숨기고 소리만 들려주기)</span>
          </label>
          <div class="yt-embed" id="p-yt-player-container"><div id="p-yt-player"></div></div>
          <p class="muted" id="p-play-status"></p>

          <p class="muted" id="p-answer-display" style="margin:12px 0; font-size:1.1rem; font-weight:700; text-align:center; cursor:pointer;"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="player.js"></script>
</body>
</html>
