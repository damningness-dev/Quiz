<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>문제 관리 - 보드게임 사운드 퀴즈쇼</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <p><a href="/index.html">&larr; 홈으로</a></p>
    <h1>🛠️ 문제 관리</h1>

    <div class="panel">
      <h2>1. 유튜브에서 소리 찾기</h2>
      <div class="row">
        <input id="search-input" placeholder="예: 카탄 주사위 소리, 젠가 무너지는 소리" />
        <button id="search-btn" class="btn-primary">검색</button>
      </div>
      <p class="muted" id="search-hint">
        검색이 안 되면 서버에 YOUTUBE_API_KEY가 설정되어 있지 않은 것입니다. 이 경우 아래 "유튜브 URL 직접 입력"에
        영상 주소를 붙여넣어 사용하세요.
      </p>
      <div id="search-results"></div>
    </div>

    <div class="panel">
      <h2 id="form-title">2. 문제 등록</h2>
      <label>이름 (정답)</label>
      <input id="q-title" placeholder="예: 카탄 / god - 거짓말" />

      <div class="row">
        <div>
          <label>카테고리</label>
          <input id="q-category" list="category-options" placeholder="예: 보드게임, 가요" />
          <datalist id="category-options"></datalist>
        </div>
        <div>
          <label>연도 (선택)</label>
          <input id="q-year" type="number" placeholder="예: 2014" />
        </div>
      </div>

      <label>유튜브 URL 직접 입력 (검색 결과를 선택했다면 자동으로 채워집니다)</label>
      <input id="q-url" placeholder="https://www.youtube.com/watch?v=..." />

      <div class="row">
        <div>
          <label>시작 시간(초)</label>
          <input id="q-start" type="number" min="0" value="0" />
        </div>
        <div>
          <label>종료 시간(초, 비워두면 끝까지)</label>
          <input id="q-end" type="number" min="0" placeholder="예: 15" />
        </div>
      </div>

      <label>메모 (선택)</label>
      <input id="q-note" placeholder="힌트나 출처 메모" />

      <div id="preview-container" style="margin-top:16px;"></div>

      <div class="row" style="margin-top: 16px;">
        <button id="preview-btn">▶ 구간 미리듣기</button>
        <button id="save-btn" class="btn-primary">문제 저장</button>
        <button id="cancel-edit-btn" style="display:none;">취소</button>
      </div>
      <p id="save-msg" class="muted"></p>
    </div>

    <div class="panel">
      <h2>3. 여러 문제 한번에 가져오기</h2>
      <p class="muted">
        Claude가 만들어준 JSON 목록을 아래에 그대로 붙여넣고 "가져오기"를 누르면 한 번에 등록됩니다.
        (git을 따로 만질 필요 없이 이 화면에서 바로 반영돼요)
      </p>
      <label>JSON 배열 붙여넣기</label>
      <textarea id="import-json" rows="6" placeholder='[{"title":"가수 - 곡명","category":"가요","year":2024,"videoId":"영상ID 또는 url 필드","start":0,"end":null,"note":"메모"}]'></textarea>
      <div class="row" style="margin-top:12px;">
        <button id="import-btn" class="btn-primary">📥 가져오기</button>
      </div>
      <p id="import-result" class="muted"></p>
    </div>

    <div class="panel">
      <h2>등록된 문제 목록 (<span id="q-count">0</span>개)</h2>
      <div class="row">
        <div>
          <label>연도 필터</label>
          <select id="filter-year"><option value="">전체</option></select>
        </div>
        <div>
          <label>카테고리 필터</label>
          <select id="filter-category"><option value="">전체</option></select>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>#</th><th>카테고리</th><th>연도</th><th>정답</th><th>구간</th><th>메모</th><th></th></tr>
          </thead>
          <tbody id="q-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="admin.js"></script>
</body>
</html>
