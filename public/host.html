<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>진행자 화면 - 보드게임 사운드 퀴즈쇼</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <p><a href="/index.html">&larr; 홈으로</a></p>
    <h1>🎤 진행자 화면</h1>
    <p class="muted" id="join-info">참가자 접속 주소를 불러오는 중...</p>

    <div class="panel">
      <h3 style="margin-bottom:8px;">🎮 출제 방식</h3>
      <div class="row" style="margin-bottom:10px;">
        <button id="mode-manual-btn">수동 출제</button>
        <button id="mode-auto-btn">자동 출제</button>
      </div>
      <div id="auto-settings" style="display:none;">
        <div class="row" style="align-items:flex-end;">
          <div>
            <label style="margin-top:0;">문제 수</label>
            <input id="auto-count" type="number" min="1" value="10" />
          </div>
          <div>
            <label style="margin-top:0;">문제 간 대기시간(초)</label>
            <input id="auto-gap" type="number" min="0" step="0.5" value="2.5" />
          </div>
        </div>
        <div class="row" style="margin-top:10px;">
          <button id="auto-start-btn" class="btn-good">▶ 자동 출제 시작</button>
          <button id="auto-stop-btn" class="btn-bad" style="display:none;">⏹ 자동 출제 중지</button>
        </div>
        <p class="muted" id="auto-status" style="margin-top:8px;"></p>
      </div>
    </div>

    <div class="panel">
      <h3 style="margin-bottom:8px;">🎚️ 재생 길이 (영상 중 랜덤 구간을 이 길이만큼 들려줍니다)</h3>
      <div id="duration-picker" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px;"></div>
    </div>

    <div class="panel">
      <h3 style="margin-bottom:8px;">🗂️ 연도 선택</h3>
      <div id="filter-year-buttons" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px;"></div>
      <h3 style="margin:16px 0 8px;">🏷️ 카테고리 선택</h3>
      <div id="filter-category-buttons" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>

    <div class="panel">
      <div class="row">
        <div style="flex:2;">
          <h2 id="q-title">문제를 선택하세요</h2>
          <span class="badge" id="q-progress"></span>
          <div class="yt-embed" id="yt-player-container"><div id="yt-player"></div></div>
        </div>
        <div style="flex:1; min-width: 220px;">
          <h3>문제 목록 (<span id="q-buttons-count">0</span>개)</h3>
          <div id="q-buttons" style="display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto;"></div>
        </div>
      </div>
    </div>

    <div class="status-banner" id="status-banner">참가자들을 기다리는 중...</div>

    <div class="panel center">
      <button id="judge-correct" class="btn-good" disabled>✅ 정답 처리</button>
      <button id="judge-wrong" class="btn-bad" disabled>❌ 오답 처리</button>
      <button id="reveal-btn" disabled>🙈 정답 공개(패스)</button>
      <button id="reset-buzz-btn">🔄 부저 초기화</button>
    </div>

    <div class="panel">
      <div class="panel-header-row">
        <h2 style="margin:0;">🏆 점수판</h2>
        <button id="reset-scores-btn" class="btn-bad">🗑️ 점수 초기화</button>
      </div>
      <ul class="scoreboard" id="scoreboard"></ul>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="host.js"></script>
</body>
</html>
