<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>보드게임 사운드 퀴즈쇼</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="landing">
    <h1>🎲 보드게임 사운드 퀴즈쇼</h1>
    <p class="muted">사운드를 듣고 보드게임을 맞혀보세요! 진행할 역할을 선택하세요.</p>
    <div class="role-cards">
      <a class="role-card" href="/admin.html">
        <div class="emoji">🛠️</div>
        <div class="role-card-text">
          <h3>문제 관리</h3>
          <p class="muted">유튜브에서 소리를 찾아 문제 등록</p>
        </div>
      </a>
      <a class="role-card" href="/host.html">
        <div class="emoji">🎤</div>
        <div class="role-card-text">
          <h3>진행자 화면</h3>
          <p class="muted">PC/TV에서 재생하고 진행</p>
        </div>
      </a>
      <a class="role-card" href="/player.html">
        <div class="emoji">📱</div>
        <div class="role-card-text">
          <h3>참가자 입장</h3>
          <p class="muted">모바일에서 부저를 눌러 참여</p>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
